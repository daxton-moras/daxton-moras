name: Generate contribution snake

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?color_snake=#a77bff&color_dots=#0d1228,#1f2a5c,#3a4c9e,#608cff,#a77bff

      # snk draws on a transparent background; give it the portfolio's dark
      # background so it reads as dark on GitHub's light theme too.
      - name: Add dark background
        run: |
          sudo python3 - <<'PY'
          import re
          p = "dist/snake-dark.svg"
          s = open(p).read()
          x, y, w, h = re.search(r'viewBox="([-\d.]+) ([-\d.]+) ([\d.]+) ([\d.]+)"', s).groups()
          bg = f'<rect x="{x}" y="{y}" width="{w}" height="{h}" rx="12" fill="#060a18"/>'
          s = s.replace("</desc>", "</desc>" + bg, 1)
          open(p, "w").write(s)
          PY

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
